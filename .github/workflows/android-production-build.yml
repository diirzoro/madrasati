name: Android Production APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-production-build.yml"

concurrency:
  group: android-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify production API
        run: curl --fail --silent --show-error --max-time 15 http://162.35.127.135:4003/api/health

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build production-connected debug APK
        run: ./gradlew :app:assembleDebug -PMADRASATI_API_BASE_URL=http://162.35.127.135:4003/ --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madrasati-production-api-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
